<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">CatGuard AI system architecture</title><desc id="desc">Training and annotation feed the object detector; video inputs feed detection, JavaScript rules, and an alert gate. Downstream notifications and local evidence are part of the original architecture, not the public demo.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#456579"/></marker></defs>
<rect width="1200" height="550" rx="18" fill="#f4f8fa"/><rect width="1200" height="90" rx="18" fill="#102b3a"/><rect y="72" width="1200" height="18" fill="#102b3a"/>
<g font-family="Arial,sans-serif"><text x="36" y="38" font-size="27" font-weight="bold" fill="#fff">CatGuard AI</text><text x="36" y="65" font-size="17" fill="#a6e6d9">System architecture / public edition</text>
<g fill="#fff" stroke="#adc4cf" stroke-width="1.5"><rect x="35" y="126" width="250" height="105" rx="10"/><rect x="35" y="294" width="250" height="105" rx="10"/><rect x="325" y="210" width="225" height="110" rx="10"/><rect x="590" y="210" width="225" height="110" rx="10"/><rect x="855" y="210" width="310" height="110" rx="10"/><rect x="855" y="365" width="310" height="100" rx="10" stroke-dasharray="6 4"/></g>
<g fill="#166d66" font-size="13" font-weight="bold"><text x="52" y="150">01 / MODEL DEVELOPMENT</text><text x="52" y="318">02 / INPUT</text><text x="343" y="234">03 / DETECTION</text><text x="608" y="234">04 / DECISION</text><text x="873" y="234">05 / OUTPUT GATE</text><text x="873" y="389">ORIGINAL DOWNSTREAM DESIGN</text></g>
<g fill="#183746" font-size="20" font-weight="bold"><text x="52" y="180">Training data</text><text x="52" y="348">Video source</text><text x="343" y="264">Deep Detect</text><text x="608" y="264">JavaScript rules</text><text x="873" y="264">Alert payload</text><text x="873" y="419">Notification + evidence</text></g>
<g fill="#456579" font-size="15"><text x="52" y="205">Two annotation sets + weights</text><text x="52" y="373">Camera or recorded video</text><text x="343" y="290">Class, score, box</text><text x="608" y="290">Door, pet, person</text><text x="873" y="290">Cooldown + daily counts</text><text x="873" y="444">Telegram / local snapshot</text></g>
<g stroke="#456579" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M285 178 H305 V244 H320"/><path d="M285 346 H305 V287 H320"/><path d="M550 265 H585"/><path d="M815 265 H850"/><path d="M1010 320 V360" stroke-dasharray="5 5"/></g>
<rect x="35" y="473" width="780" height="48" rx="8" fill="#e0f0ee"/><text x="53" y="502" font-size="15" font-weight="bold" fill="#166d66">Public demo: synthetic detections → rules → local console output only.</text>
<text x="855" y="506" font-size="14" fill="#456579">No live services or private media bundled.</text></g></svg>
